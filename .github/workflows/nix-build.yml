name: Nix Build

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        system: [x86_64-linux]
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: adithyagenie
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build --no-link --print-out-paths .#nvidia-driver-base .#nvidia-driver-open .#nvidia-settings | cachix push adithyagenie
